services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgermatch
      POSTGRES_USER: ledgermatch
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - reconciliation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgermatch -d ledgermatch"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      ConnectionStrings__Database: "Host=db;Database=ledgermatch;Username=ledgermatch;Password=local-demo-only"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "127.0.0.1:5087:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  reconciliation-data:
