services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mutabakat
      POSTGRES_USER: mutabakat
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - reconciliation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutabakat -d mutabakat"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      ConnectionStrings__Database: "Host=db;Database=mutabakat;Username=mutabakat;Password=local-demo-only"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "127.0.0.1:5087:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  reconciliation-data:
